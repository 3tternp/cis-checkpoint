<!doctype html><html><head><meta charset="utf-8"><title>Scan Results</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><div><h1>Scan Complete</h1><p>{{meta.hostname}} · {{meta.version}} · {{meta.role}}</p></div></header><main><div class="actions"><a class="button" href="{{url_for('report',rid=report_id)}}">Download HTML Report</a><a href="{{url_for('index')}}">Scan another archive</a></div><section class="panel"><h2>Results</h2><table><tr><th>ID</th><th>Finding</th><th>Status</th><th>Severity</th><th>Confidence</th></tr>{% for f in findings %}<tr><td>{{f.id}}</td><td>{{f.title}}</td><td><span class="status {{f.status|lower|replace(' ','-')}}">{{f.status}}</span></td><td>{{f.severity}}</td><td>{{f.confidence}}%</td></tr>{% endfor %}</table></section></main></body></html>
